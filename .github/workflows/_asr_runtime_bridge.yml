name: Temporary ASR Runtime Bridge

on:
  push:
    paths:
      - '.github/workflows/_asr_runtime_bridge.yml'

permissions:
  contents: read

jobs:
  build-asr-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential curl

      - name: Build whisper.cpp CLI
        run: |
          git clone --depth 1 --branch v1.8.6 https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF
          cmake --build whisper.cpp/build --config Release -j2 --target whisper-cli
          whisper.cpp/build/bin/whisper-cli --help >/dev/null

      - name: Download multilingual quantized models
        run: |
          mkdir -p asr-runtime/models asr-runtime/bin
          cp whisper.cpp/build/bin/whisper-cli asr-runtime/bin/
          curl -L --fail --retry 3 -o asr-runtime/models/ggml-base-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          curl -L --fail --retry 3 -o asr-runtime/models/ggml-small-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          ls -lh asr-runtime/bin asr-runtime/models
          ldd asr-runtime/bin/whisper-cli || true

      - name: Upload ASR runtime
        uses: actions/upload-artifact@v4
        with:
          name: asr-runtime-linux-x64
          path: asr-runtime
          retention-days: 1
          compression-level: 0
