name: Temporary Whisper VAD Model Fetch

on:
  push:
    paths:
      - '.github/workflows/fetch-whisper-vad.yml'
  workflow_dispatch:

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Silero VAD model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 \
            'https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin' \
            -o ggml-silero-v6.2.0.bin
          test -s ggml-silero-v6.2.0.bin
      - name: Upload VAD model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-silero-v6-2-bin
          path: ggml-silero-v6.2.0.bin
          compression-level: 0
          retention-days: 1
