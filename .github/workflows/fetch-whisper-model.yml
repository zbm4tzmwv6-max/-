name: Fetch Whisper Model

on:
  push:
    paths:
      - '.github/workflows/fetch-whisper-model.yml'
  workflow_dispatch:

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper base q5_1 model
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o ggml-base-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          test -s ggml-base-q5_1.bin
          ls -lh ggml-base-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-q5_1
          path: ggml-base-q5_1.bin
          retention-days: 1
          compression-level: 0
